name: Silver to Gold and EDA Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-public-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pycountry openpyxl matplotlib

      - name: Pull Git LFS data
        run: git lfs pull

      - name: Run Silver cleanup, geographic validation, Gold assembly, and EDA
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          project_root = Path.cwd()
          sys.path.insert(0, str(project_root / 'src'))

          from cleaning import clean_silver_directory
          from geographic_keys import validate_clean_directory
          from feature_assembly import assemble_feature_table
          from eda_reporting import generate_eda_outputs
          from paths import CLEAN_DIR, CLEAN_REPORTS_DIR, OUTPUTS_DIR

          clean_summary, _ = clean_silver_directory()
          print('\nSILVER CLEANING SUMMARY')
          print(clean_summary.to_string(index=False))

          errors = clean_summary[clean_summary['status'].eq('error')]
          if not errors.empty:
              raise RuntimeError(f'Silver cleaning failures:\n{errors.to_string(index=False)}')

          geo_summary = validate_clean_directory(CLEAN_DIR, CLEAN_REPORTS_DIR)
          print('\nGEOGRAPHIC VALIDATION SUMMARY')
          print(geo_summary.to_string(index=False))

          if geo_summary.empty:
              raise RuntimeError('Geographic validation returned no source files.')
          if not geo_summary['key_unique'].all():
              raise RuntimeError('At least one Silver source failed geographic key uniqueness.')

          assembled, report, catalog = assemble_feature_table()
          print('\nGOLD ASSEMBLY REPORT')
          print(report.to_string(index=False))
          print(f'\nGold rows: {len(assembled):,}')
          print(f'Gold columns: {len(assembled.columns):,}')
          print(f'Feature catalog rows: {len(catalog):,}')

          key_columns = ['iso3', 'country', 'year', 'month']
          if assembled.empty:
              raise RuntimeError('Gold feature table is empty.')
          if assembled.duplicated(key_columns).any():
              raise RuntimeError('Gold feature table contains duplicate modeling keys.')

          reports_dir = OUTPUTS_DIR / 'eda_reports'
          visuals_dir = OUTPUTS_DIR / 'eda_visuals'
          eda_outputs = generate_eda_outputs(assembled, reports_dir, visuals_dir)

          required_reports = {
              'base_feature_gold_integrity.csv',
              'base_feature_missingness.csv',
              'base_feature_year_coverage.csv',
              'base_feature_country_coverage.csv',
              'base_feature_numeric_summary.csv',
              'base_feature_meaningful_correlations.csv',
              'eda_findings_summary.csv',
          }
          required_visuals = {
              'gold_integrity_summary.png',
              'feature_missingness.png',
              'temporal_coverage.png',
              'geographic_coverage.png',
              'numeric_distributions.png',
              'pairwise_feature_correlations.png',
              'eda_findings_summary.png',
          }

          written_reports = {path.name for path in reports_dir.glob('*.csv')}
          written_visuals = {path.name for path in visuals_dir.glob('*.png')}
          missing_reports = required_reports - written_reports
          missing_visuals = required_visuals - written_visuals
          if missing_reports or missing_visuals:
              raise RuntimeError(
                  f'Missing EDA artifacts. Reports={sorted(missing_reports)}, Visuals={sorted(missing_visuals)}'
              )

          print('\nEDA FINDINGS SUMMARY')
          print(eda_outputs['findings_summary'].to_string(index=False))
          print('\nSilver → Gold → EDA validation passed.')
          PY

      - name: Upload public pipeline validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pipeline-validation-artifacts
          if-no-files-found: warn
          path: |
            outputs/model_features/
            outputs/feature_reports/
            outputs/cleaning_reports/
            outputs/eda_reports/
            outputs/eda_visuals/
